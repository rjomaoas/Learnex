name: learnex_app
description: Static E-Learning App Demo
version: 1.2.0+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto/static/Roboto-Regular.ttf
    - family: ZillaSlab
      fonts:
        - asset: assets/fonts/Zilla_Slab/ZillaSlab-SemiBold.ttf